services:
  lagowska46-ovh-dyndns:
    build: .
    image: ovh-dyndns:latest
    container_name: lagowska46-ovh-dyndns
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAMES: "lagowska46.ovh ha.lagowska46.ovh frigate.lagowska46.ovh traefik.lagowska46.ovh phpmyadmin.lagowska46.ovh ollama.lagowska46.ovh keycloak.lagowska46.ovh thirdleg.lagowska46.ovh b2borganizer.lagowska46.ovh pgadmin.lagowska46.ovh n8n.lagowska46.ovh laforge.lagowska46.ovh jordan.lagowska46.ovh umami.lagowska46.ovh garmin-mcp.lagowska46.ovh sheets-mcp.lagowska46.ovh baselinker-mcp.lagowska46.ovh mail-mcp.lagowska46.ovh"
      INTERVAL: 300    # w sekundach, co ile ma się odświeżać (domyślnie 300s)

  raszkowski-pl-dyndns:
    build: .
    image: ovh-dyndns:latest
    container_name: raszkowski-pl-dyndns
    restart: unless-stopped
    env_file:
      - .env.raszkowski
    environment:
      HOSTNAMES: "matrix.raszkowski.pl element.raszkowski.pl"
      INTERVAL: 300
      NEXTDNS_LINK: ""   # pusty = pomijamy ping (lagowska46-ovh-dyndns już to robi)
